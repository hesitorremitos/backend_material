<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Esta es mi pagina frontend</h1>
    <p>El mensaje es: </p><span id="mensaje"></span>

    <script>
        // Consumo del backend
        fetch("/mensaje")
            .then((res)=> res.json())
            .then((json)=>{
                contenedor = document.getElementById("mensaje")
                contenedor.innerHTML = json.mensajes
            })
    </script>
</body>
</html>
